name: Part 5 World Address Helper

on:
  push:
    branches:
      - refactor/body-shape-contact-reaudit

permissions:
  contents: write

jobs:
  patch-world-address-stability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/body-shape-contact-reaudit
          fetch-depth: 0

      - name: Make world address-stable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/dynamics/world.h')
          text = path.read_text(encoding='utf-8')

          old = '''class world\n{\npublic:\n'''
          new = '''class world\n{\npublic:\n    world() = default;\n\n    world( const world& ) = delete;\n    world& operator=( const world& ) = delete;\n\n    world( world&& ) = delete;\n    world& operator=( world&& ) = delete;\n\n'''

          if text.count(old) != 1:
              raise RuntimeError(f'expected one world class opening, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/part5-world-address-helper.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dynamics/world.h .github/workflows/part5-world-address-helper.yml
          git commit -m 'Keep world address stable for public handles'
          git push origin HEAD:refactor/body-shape-contact-reaudit
