name: Fix Weld UI Smoke

on:
  push:
    branches:
      - feature/weld-joint

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weld-joint
          fetch-depth: 0

      - name: Fix smoke test and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/sandbox/demo_ui_test.cpp")
          text = path.read_text(encoding="utf-8")
          old = """        demoInput input{};
        input.mousePressed = true;
        input.mouseHeld = true;
        const auto body = model.getKind() == demoKind::distancePendulum ? model.getPendulumBody() : model.getImpulseBody();
        input.mousePosition = model.getWorld().GetBodyTransform( body ).position;
        session.handleInput( input, true );
        if( !model.getWorld().IsValid( model.getMouseJoint() ) )
        {
            std::fprintf( stderr, \"smoke drag did not start\\n\" );
            std::exit( EXIT_FAILURE );
        }
"""
          new = """        // Weld pair는 두 Dynamic Body 자체의 상대 transform을 관찰하는 장면이라 Mouse Joint용 Static 기준 Body가 없음.
        if( model.getKind() != demoKind::weldPair )
        {
            demoInput input{};
            input.mousePressed = true;
            input.mouseHeld = true;
            const auto body = model.getKind() == demoKind::distancePendulum ? model.getPendulumBody() : model.getImpulseBody();
            input.mousePosition = model.getWorld().GetBodyTransform( body ).position;
            session.handleInput( input, true );
            if( !model.getWorld().IsValid( model.getMouseJoint() ) )
            {
                std::fprintf( stderr, \"smoke drag did not start\\n\" );
                std::exit( EXIT_FAILURE );
            }
        }
"""
          if text.count(old) != 1:
              raise RuntimeError(f"expected one smoke drag block, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git rm .github/workflows/fix-weld-ui-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sandbox/demo_ui_test.cpp
          git commit -m "Allow Weld smoke view without mouse anchor"
          git push origin HEAD:feature/weld-joint
