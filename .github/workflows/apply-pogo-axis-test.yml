name: Apply Pogo axis test

on:
  push:
    branches:
      - feature/pogo-joint
    paths:
      - "tools/add_pogo_axis_test.py"
      - ".github/workflows/apply-pogo-axis-test.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pogo-joint
          fetch-depth: 0

      - name: Apply regression test
        run: python3 tools/add_pogo_axis_test.py

      - name: Commit regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dynamics/pogo_joint_test.cpp
          git commit -m "test: keep Pogo measurement axis fixed per substep"
          git push origin HEAD:feature/pogo-joint
