name: Current Box2D chain patch

on:
  push:
    branches:
      - feature/terrain-chain-lifecycle
    paths:
      - .github/workflows/chain-current-box2d-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terrain-chain-lifecycle
          fetch-depth: 0

      - name: Match current Box2D open-chain contract
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}\n{old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          world = Path("src/dynamics/world.cpp")
          replace_once(world,
          '''    assert( definition.points.size() >= 4 );
              assert( std::isfinite( definition.friction ) && definition.friction >= 0.0f );
              assert( std::isfinite( definition.restitution ) && definition.restitution >= 0.0f );
          
              const std::span<const vec2> points = definition.points;
              const float minimumLengthSquared = LINEAR_SLOP * LINEAR_SLOP;
          
              for( const vec2& point : points )
              {
                  assert( IsFinite( point ) );
              }
          
              for( std::size_t i = 0; i + 1 < points.size(); ++i )
              {
                  assert( LengthSquared( points[i + 1] - points[i] ) > minimumLengthSquared );
              }
          
              if( definition.isLoop )
              {
                  assert( LengthSquared( points.front() - points.back() ) > minimumLengthSquared );
              }
          ''',
          '''    assert( definition.isLoop ? definition.points.size() >= 3 : definition.points.size() >= 2 );
              assert( std::isfinite( definition.friction ) && definition.friction >= 0.0f );
              assert( std::isfinite( definition.restitution ) && definition.restitution >= 0.0f );
          
              const std::span<const vec2> points = definition.points;
              const float minimumLengthSquared = LINEAR_SLOP * LINEAR_SLOP;
          
              for( const vec2& point : points )
              {
                  assert( IsFinite( point ) );
              }
          
              for( std::size_t i = 0; i + 1 < points.size(); ++i )
              {
                  assert( LengthSquared( points[i + 1] - points[i] ) > minimumLengthSquared );
              }
          
              if( definition.isLoop )
              {
                  assert( LengthSquared( points.front() - points.back() ) > minimumLengthSquared );
              }
              else
              {
                  assert( IsFinite( definition.ghost1 ) && IsFinite( definition.ghost2 ) );
                  assert( LengthSquared( points.front() - definition.ghost1 ) > minimumLengthSquared );
                  assert( LengthSquared( definition.ghost2 - points.back() ) > minimumLengthSquared );
              }
          ''')

          replace_once(world,
          '''    const std::size_t segmentCount = definition.isLoop ? points.size() : points.size() - 3;
          ''',
          '''    const std::size_t segmentCount = definition.isLoop ? points.size() : points.size() - 1;
          ''')

          replace_once(world,
          '''    else
              {
                  for( std::size_t i = 0; i + 3 < points.size(); ++i )
                  {
                      createSegment( points[i], points[i + 1], points[i + 2], points[i + 3] );
                  }
              }
          ''',
          '''    else
              {
                  const std::size_t count = points.size();
                  for( std::size_t i = 0; i + 1 < count; ++i )
                  {
                      const vec2 ghost1 = i == 0 ? definition.ghost1 : points[i - 1];
                      const vec2 ghost2 = i + 2 == count ? definition.ghost2 : points[i + 2];
                      createSegment( ghost1, points[i], points[i + 1], ghost2 );
                  }
              }
          ''')

          test = Path("tests/dynamics/body_shape_contact_lifecycle_test.cpp")
          replace_once(test,
          '''    // Open chain의 양 끝 점은 ghost vertex이고 가운데 두 점 사이만 실제 collision edge가 됨.
              const std::array<vec2, 4> openPoints{ vec2{ 2.0f, 0.0f }, vec2{ 1.0f, 0.0f }, vec2{ -1.0f, 0.0f }, vec2{ -2.0f, 0.0f } };
              chainDef openDef{};
              openDef.points = openPoints;
          
              const chainId openChain = simulation.CreateChain( terrainBody, openDef );
              check( simulation.IsValid( openChain ), "open chain invalid" );
              check( simulation.GetChainCount() == 1, "open chain count" );
              check( simulation.GetChainSegmentCount( openChain ) == 1, "open chain segment count" );
          
              std::array<shapeId, 1> openSegments{};
              check( simulation.GetChainSegments( openChain, openSegments ) == 1, "open chain segment query" );
              check( simulation.IsValid( openSegments[0] ), "open chain child invalid" );
              check( simulation.GetShapeParentChain( openSegments[0] ) == openChain, "open chain parent link" );
              check( simulation.GetShapeCount() == 1 && simulation.GetBody( terrainBody ).shapeCount == 1, "open chain child shape count" );
          
              // point1 -> point2의 오른쪽이 앞면이므로 이 방향에서는 위쪽 circle만 접촉함.
              const bodyId circleBody = simulation.CreateBody( bodyType::Dynamic, { { 0.0f, 0.5f }, {} } );
          ''',
          '''    // 현재 Box2D처럼 open chain은 실제 points와 시작/끝 ghost point를 별도로 받음.
              // 실제 point N개는 N-1개의 collision segment를 생성함.
              const std::array<vec2, 3> openPoints{ vec2{ 1.0f, 0.0f }, vec2{ 0.0f, 0.0f }, vec2{ -1.0f, 0.0f } };
              chainDef openDef{};
              openDef.points = openPoints;
              openDef.ghost1 = { 2.0f, 0.0f };
              openDef.ghost2 = { -2.0f, 0.0f };
          
              const chainId openChain = simulation.CreateChain( terrainBody, openDef );
              check( simulation.IsValid( openChain ), "open chain invalid" );
              check( simulation.GetChainCount() == 1, "open chain count" );
              check( simulation.GetChainSegmentCount( openChain ) == 2, "open chain segment count" );
          
              std::array<shapeId, 2> openSegments{};
              check( simulation.GetChainSegments( openChain, openSegments ) == 2, "open chain segment query" );
              for( shapeId segment : openSegments )
              {
                  check( simulation.IsValid( segment ), "open chain child invalid" );
                  check( simulation.GetShapeParentChain( segment ) == openChain, "open chain parent link" );
              }
              check( simulation.GetShapeCount() == 2 && simulation.GetBody( terrainBody ).shapeCount == 2, "open chain child shape count" );
          
              // point1 -> point2의 오른쪽이 앞면이므로 이 방향에서는 위쪽 circle만 접촉함.
              const bodyId circleBody = simulation.CreateBody( bodyType::Dynamic, { { 0.5f, 0.5f }, {} } );
          ''')

          replace_once(test,
          '''    simulation.DestroyChain( openChain );
              check( !simulation.IsValid( openChain ) && !simulation.IsValid( openSegments[0] ), "destroy chain invalidation" );
              check( simulation.GetChainCount() == 0 && simulation.GetShapeCount() == 1 && simulation.GetContactCount() == 0, "destroy chain cascade counts" );
          
              const chainId reusedChain = simulation.CreateChain( terrainBody, openDef );
              check( reusedChain.index1 == openChain.index1 && reusedChain.generation != openChain.generation, "chain generation reuse" );
          
              std::array<shapeId, 1> reusedSegments{};
              check( simulation.GetChainSegments( reusedChain, reusedSegments ) == 1, "reused chain segment query" );
          
              // Body 파괴는 parent chain과 내부 segment shape를 함께 제거해야 함.
              simulation.DestroyBody( terrainBody );
              check( !simulation.IsValid( reusedChain ) && !simulation.IsValid( reusedSegments[0] ), "body chain cascade invalidation" );
              check( simulation.GetChainCount() == 0 && simulation.GetShapeCount() == 1, "body chain cascade counts" );
          ''',
          '''    simulation.DestroyChain( openChain );
              check( !simulation.IsValid( openChain ) && !simulation.IsValid( openSegments[0] ) && !simulation.IsValid( openSegments[1] ), "destroy chain invalidation" );
              check( simulation.GetChainCount() == 0 && simulation.GetShapeCount() == 1 && simulation.GetContactCount() == 0, "destroy chain cascade counts" );
          
              const chainId reusedChain = simulation.CreateChain( terrainBody, openDef );
              check( reusedChain.index1 == openChain.index1 && reusedChain.generation != openChain.generation, "chain generation reuse" );
          
              std::array<shapeId, 2> reusedSegments{};
              check( simulation.GetChainSegments( reusedChain, reusedSegments ) == 2, "reused chain segment query" );
          
              // Body 파괴는 parent chain과 내부 segment shape를 함께 제거해야 함.
              simulation.DestroyBody( terrainBody );
              check( !simulation.IsValid( reusedChain ) && !simulation.IsValid( reusedSegments[0] ) && !simulation.IsValid( reusedSegments[1] ), "body chain cascade invalidation" );
              check( simulation.GetChainCount() == 0 && simulation.GetShapeCount() == 1, "body chain cascade counts" );
          ''')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.cpp tests/dynamics/body_shape_contact_lifecycle_test.cpp
          git commit -m "fix(dynamics): use explicit open-chain ghosts"
          git push origin HEAD:feature/terrain-chain-lifecycle
