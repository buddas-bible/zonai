name: Clean Motor spring Sandbox markers

on:
  push:
    branches:
      - feature/motor-joint-spring
    paths:
      - tools/fix_motor_spring_sandbox_markers.py
      - .github/workflows/fix-motor-spring-sandbox-markers.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motor-joint-spring
      - name: Clean duplicate markers
        run: python3 tools/fix_motor_spring_sandbox_markers.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox/rigidBodyJointDemo.cpp sandbox/jointDemoView.cpp
          git diff --cached --check
          git commit -m "Clean Motor spring Sandbox markers"
          git push origin HEAD:feature/motor-joint-spring
