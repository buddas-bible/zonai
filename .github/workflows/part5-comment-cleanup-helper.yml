name: Part 5 Comment Cleanup Helper

on:
  push:
    branches:
      - refactor/body-shape-contact-reaudit

permissions:
  contents: write

jobs:
  cleanup-part5-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/body-shape-contact-reaudit
          fetch-depth: 0

      - name: Clean audited comments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/dynamics/body_test.cpp'): [
                  (
                      '// Public handle이 world 객체 주소를 ownership token으로 사용하므로 생성된 world의 주소는 고정되어야 함.',
                      '// Public handle의 world lifetime은 한 simulation world와 1:1이므로 world는 값 복사/이동하지 않음.'
                  ),
              ],
              Path('src/dynamics/world.h'): [
                  (
                      '// null / 범위 / generation / 활성 slot을 모두 확인함.',
                      '// world lifetime / null / 범위 / generation / 활성 slot을 모두 확인함.'
                  ),
              ],
              Path('src/dynamics/world.cpp'): [
                  (
                      '// Sensor Contact query는 Sensor 저장소를 구현할 때 별도로 연결함.',
                      '// Sensor는 Contact를 만들지 않으므로 overlap 정보는 Sensor API에서 별도로 조회함.'
                  ),
                  (
                      'data.manifold = ToWorldManifold( contactSim.manifold, bodySimA.transform  );',
                      'data.manifold = ToWorldManifold( contactSim.manifold, bodySimA.transform );'
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/part5-comment-cleanup-helper.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dynamics/world.cpp src/dynamics/world.h tests/dynamics/body_test.cpp .github/workflows/part5-comment-cleanup-helper.yml
          git commit -m 'Clean Part 5 ownership comments'
          git push origin HEAD:refactor/body-shape-contact-reaudit
