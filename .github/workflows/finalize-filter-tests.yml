name: Finalize Filter Joint tests

on:
  push:
    branches:
      - feature/filter-joint
    paths:
      - "tools/finalize_filter_tests.py"
      - ".github/workflows/finalize-filter-tests.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/filter-joint
          fetch-depth: 0

      - name: Finalize focused tests
        run: python3 tools/finalize_filter_tests.py

      - name: Commit focused tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CMakeLists.txt tests/dynamics/pogo_joint_world_test.cpp .github/workflows/cmake.yml
          git commit -m "test: register Filter Joint focused tests"
          git push origin HEAD:feature/filter-joint
