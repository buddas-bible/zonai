name: Orphan chain segment GREEN patch

on:
  push:
    branches:
      - feature/orphan-chain-segment-update

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orphan-chain-segment-update
          fetch-depth: 0
      - name: Patch World API
        run: python .github/orphan_chain_green_patch.py
      - name: Commit World API
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.h
          git commit -m "feat(dynamics): expose orphan chain segment update"
          git push origin HEAD:feature/orphan-chain-segment-update
