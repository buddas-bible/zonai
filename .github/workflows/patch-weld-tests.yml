name: Patch Weld Tests

on:
  push:
    branches:
      - feature/weld-joint

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weld-joint
          fetch-depth: 0

      - name: Split Weld tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "tests/dynamics/weld_joint_test.cpp",
              '#include "dynamics/joints/weldJointConstraint2.h"\n#include "dynamics/world.h"',
              '#include "dynamics/joints/weldJointConstraint2.h"'
          )

          replace_once(
              "tests/dynamics/weld_joint_test.cpp",
              '''
              world simulation;
              simulation.SetGravity( {} );
              const bodyId ground = simulation.CreateBody();
              const bodyId body = simulation.CreateBody( bodyType::Dynamic );
              weldJointDef definition{};
              definition.bodyA = ground;
              definition.bodyB = body;
              const jointId id = simulation.createWeldJoint( definition );
              const weldJointData data = simulation.getWeldJointData( id );
              check( simulation.IsValid( id ) && data.bodyA == ground && data.bodyB == body, "Weld World API creates and queries the joint" );

          ''',
              ''
          )

          replace_once(
              "tests/CMakeLists.txt",
              '''add_executable(weldJointTests dynamics/weld_joint_test.cpp)
          target_link_libraries(weldJointTests PRIVATE zonai::zonai)
          add_test(NAME weldJointTests COMMAND weldJointTests)

          add_executable(sandboxDemoTests''',
              '''add_executable(weldJointTests dynamics/weld_joint_test.cpp)
          target_link_libraries(weldJointTests PRIVATE zonai::zonai)
          add_test(NAME weldJointTests COMMAND weldJointTests)

          add_executable(weldJointWorldTests dynamics/weld_joint_world_test.cpp)
          target_link_libraries(weldJointWorldTests PRIVATE zonai::zonai)
          add_test(NAME weldJointWorldTests COMMAND weldJointWorldTests)

          add_executable(sandboxDemoTests'''
          )

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CMakeLists.txt tests/dynamics/weld_joint_test.cpp
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Split Weld World tests"
          git push origin HEAD:feature/weld-joint
