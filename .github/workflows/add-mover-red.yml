name: Verify Mover RED

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: read

jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Install CMake 4.2
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Verify missing Mover solver fails the build
        shell: bash
        run: |
          set +e
          cmake --build build --target moverJointTests --parallel 2 > build.log 2>&1
          status=$?
          set -e
          cat build.log
          if [ "$status" -eq 0 ]; then
            echo "Expected moverJointTests build to fail before implementation"
            exit 1
          fi
          grep -q "moverJointConstraint2.h" build.log
