name: Verify Mover Sandbox RED

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - "tools/add_mover_red.py"
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Apply Sandbox RED test
        run: python3 tools/add_mover_red.py

      - name: Install CMake 4.2
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Verify missing Sandbox Mover demo fails the build
        shell: bash
        run: |
          set +e
          cmake --build build --target sandboxMoverJointDemoTests --parallel 2 > build.log 2>&1
          status=$?
          set -e
          cat build.log
          if [ "$status" -eq 0 ]; then
            echo "Expected sandboxMoverJointDemoTests build to fail before demo integration"
            exit 1
          fi
          grep -Eq "moverJointPlayground|moverJointDemoPreset|getMoverJoint|applyMoverJointPreset|setMoverJointSettings" build.log

      - name: Commit Sandbox RED test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CMakeLists.txt tests/sandbox/mover_joint_demo_test.cpp
          if git diff --cached --quiet; then
            echo "No test changes"
          else
            git commit -m "Add Mover Sandbox RED test"
            git push origin HEAD:feature/mover-joint
          fi
