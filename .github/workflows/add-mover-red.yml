name: Verify Mover UI RED

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - "tools/add_mover_red.py"
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Apply Mover UI RED test
        run: python tools/add_mover_red.py

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON

      - name: Build joint view test
        run: cmake --build build --config Debug --target sandboxJointViewTests --parallel 2

      - name: Verify missing Mover overlay fails the test
        shell: pwsh
        run: |
          $output = & .\build\tests\Debug\sandboxJointViewTests.exe 2>&1
          $status = $LASTEXITCODE
          $output | Write-Host
          if ($status -eq 0) {
            throw "Expected sandboxJointViewTests to fail before Mover view integration"
          }
          if (($output -join "`n") -notmatch "Mover joint view drew no velocity/reaction overlay") {
            throw "Mover UI RED failed for an unexpected reason"
          }

      - name: Commit Mover UI RED test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sandbox/joint_demo_ui_test.cpp
          if git diff --cached --quiet; then
            echo "No UI test changes"
          else
            git commit -m "Add Mover UI RED test"
            git push origin HEAD:feature/mover-joint
          fi
