name: Build Mover Warm Start GREEN

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - "tools/add_mover_red.py"
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Apply warm-start support
        run: python3 tools/add_mover_red.py

      - name: Install CMake 4.2
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused Mover test
        run: cmake --build build --target moverJointTests --parallel 2

      - name: Run focused Mover test
        run: ctest --test-dir build -R "^moverJointTests$" --output-on-failure

      - name: Commit warm-start support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/joints/moverJointSim2.h src/dynamics/joints/moverJointConstraint2.h src/dynamics/joints/moverJointConstraint2.cpp
          if git diff --cached --quiet; then
            echo "No solver changes"
          else
            git commit -m "Add Mover warm start"
            git push origin HEAD:feature/mover-joint
          fi
