name: Build Mover Sandbox GREEN

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - "tools/add_mover_red.py"
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Apply Mover Sandbox integration
        run: python3 tools/add_mover_red.py

      - name: Install CMake 4.2
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build Sandbox regression tests
        run: cmake --build build --target sandboxMoverJointDemoTests sandboxMotorJointDemoTests sandboxDemoTests sandboxJointDemoTests --parallel 2

      - name: Run Sandbox regression tests
        run: ctest --test-dir build -R "^(sandboxMoverJointDemoTests|sandboxMotorJointDemoTests|sandboxDemoTests|sandboxJointDemoTests)$" --output-on-failure

      - name: Commit Sandbox integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox/demo.h sandbox/demo.cpp sandbox/rigidBodyDemo.h sandbox/rigidBodyDemo.cpp sandbox/rigidBodyJointDemo.cpp tests/sandbox/demo_test.cpp tests/sandbox/joint_demo_test.cpp tests/sandbox/motor_joint_demo_test.cpp
          if git diff --cached --quiet; then
            echo "No Sandbox changes"
          else
            git commit -m "Add Mover Joint Sandbox"
            git push origin HEAD:feature/mover-joint
          fi
