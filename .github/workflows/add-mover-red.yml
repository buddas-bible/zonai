name: Build Mover World GREEN

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - "tools/add_mover_red.py"
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Apply Mover World integration
        run: python3 tools/add_mover_red.py

      - name: Install CMake 4.2
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused Mover tests
        run: cmake --build build --target moverJointTests moverJointWorldTests --parallel 2

      - name: Run focused Mover tests
        run: ctest --test-dir build -R "^moverJoint(Tests|WorldTests)$" --output-on-failure

      - name: Commit World integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/joints/moverJoint2.h src/dynamics/world.h src/dynamics/world.cpp
          if git diff --cached --quiet; then
            echo "No World changes"
          else
            git commit -m "Integrate Mover Joint into World"
            git push origin HEAD:feature/mover-joint
          fi
