name: Build Mover Joint View GREEN

on:
  push:
    branches:
      - feature/mover-joint
    paths:
      - "tools/add_mover_red.py"
      - ".github/workflows/add-mover-red.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mover-joint

      - name: Apply Mover joint view integration
        run: python tools/add_mover_red.py

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON

      - name: Build joint view test
        run: cmake --build build --config Debug --target sandboxJointViewTests --parallel 2

      - name: Run joint view regression test
        run: .\build\tests\Debug\sandboxJointViewTests.exe

      - name: Commit Mover joint view
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox/jointDemoView.cpp
          if git diff --cached --quiet; then
            echo "No joint view changes"
          else
            git commit -m "Add Mover Joint inspector and debug draw"
            git push origin HEAD:feature/mover-joint
          fi
