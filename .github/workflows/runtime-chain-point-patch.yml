name: Runtime Chain Point Patch

on:
  push:
    branches:
      - feature/runtime-chain-point-edit
    paths:
      - ".github/workflows/runtime-chain-point-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/runtime-chain-point-edit

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          world_h = Path("src/dynamics/world.h")
          text = world_h.read_text(encoding="utf-8")
          old = "    [[nodiscard]] chainId CreateChain( bodyId bodyId, const chainDef& definition );\n    void DestroyChain( chainId chainId );\n\n    [[nodiscard]] std::size_t GetChainSegmentCount( chainId chainId ) const;\n"
          new = "    [[nodiscard]] chainId CreateChain( bodyId bodyId, const chainDef& definition );\n    void DestroyChain( chainId chainId );\n\n    // Parent chain의 point 하나를 stable child handle 안에서 바꾸고 인접 ghost adjacency도 함께 다시 연결함.\n    void SetChainPoint( chainId chainId, std::size_t pointIndex, vec2 point );\n\n    [[nodiscard]] std::size_t GetChainSegmentCount( chainId chainId ) const;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    void DestroyBodyByIndex( std::int32_t bodyIndex );\n    void DestroyChainByIndex( std::int32_t chainIndex, bool deferBodyUpdates = false );\n    void DestroyShapeByIndex( std::int32_t shapeIndex, bool deferBodyUpdates = false, bool destroyContacts = true );\n\n    // bodySim transform을 기준으로 이 body의 모든 shape proxy를 broadPhase에 동기화함.\n"
          new = "    void DestroyBodyByIndex( std::int32_t bodyIndex );\n    void DestroyChainByIndex( std::int32_t chainIndex, bool deferBodyUpdates = false );\n    void DestroyShapeByIndex( std::int32_t shapeIndex, bool deferBodyUpdates = false, bool destroyContacts = true );\n\n    // 검증된 chain segment geometry를 같은 stable shape slot에 반영하고 contact / proxy bounds를 갱신함.\n    void UpdateChainSegmentByIndex( std::int32_t shapeIndex, const chainSegment2& chainSegment );\n\n    // bodySim transform을 기준으로 이 body의 모든 shape proxy를 broadPhase에 동기화함.\n"
          assert old in text
          world_h.write_text(text.replace(old, new, 1), encoding="utf-8")

          world_cpp = Path("src/dynamics/world.cpp")
          text = world_cpp.read_text(encoding="utf-8")
          old = "    chain.chainId = chainIndex;\n    chain.bodyId = bodyIndex;\n    chain.generation = generation;\n"
          new = "    chain.chainId = chainIndex;\n    chain.bodyId = bodyIndex;\n    chain.generation = generation;\n    chain.isLoop = definition.isLoop;\n"
          assert old in text
          world_cpp.write_text(text.replace(old, new, 1), encoding="utf-8")

          chain_world = Path("src/dynamics/chainSegmentWorld.cpp")
          encoded = ""
          chain_world.write_bytes(base64.b64decode(encoded))
          PY

      - name: Install CMake 4.2
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure
        run: cmake -S . -B build -DZONAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused test
        run: cmake --build build --target sandboxTerrainChainDemoTests --parallel 2

      - name: Run focused test
        run: ctest --test-dir build -R "^sandboxTerrainChainDemoTests$" --output-on-failure

      - name: Commit implementation
        run: |
          git config user.name "buddas-bible"
          git config user.email "104293172+buddas-bible@users.noreply.github.com"
          git add src/dynamics/world.h src/dynamics/world.cpp src/dynamics/chainSegmentWorld.cpp
          git commit -m "feat: edit parent chain points at runtime"
          git push origin HEAD:feature/runtime-chain-point-edit
