name: Chain contact wake patch

on:
  push:
    branches:
      - feature/terrain-chain-lifecycle
    paths:
      - .github/workflows/chain-contact-wake-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terrain-chain-lifecycle
          fetch-depth: 0
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          world_cpp = Path("src/dynamics/world.cpp")
          cpp = world_cpp.read_text(encoding="utf-8")

          old_shape_contact = """        if( contact.shapeIdA == shapeIndex || contact.shapeIdB == shapeIndex )
        {
            DestroyContact( contactId );
        }"""
          new_shape_contact = """        if( contact.shapeIdA == shapeIndex || contact.shapeIdB == shapeIndex )
        {
            // Chain batch는 시작할 때 연결 component를 이미 한 번 깨웠으므로
            // child contact마다 같은 component wake를 반복하지 않음.
            DestroyContact( contactId, !deferBodyUpdates );
        }"""
          if cpp.count(old_shape_contact) != 1:
              raise RuntimeError(f"DestroyShape contact block mismatch: {cpp.count(old_shape_contact)}")
          cpp = cpp.replace(old_shape_contact, new_shape_contact, 1)

          old_signature = "void world::DestroyContact( std::int32_t contactId )"
          new_signature = "void world::DestroyContact( std::int32_t contactId, bool wakeBodies )"
          if cpp.count(old_signature) != 1:
              raise RuntimeError("DestroyContact signature mismatch")
          cpp = cpp.replace(old_signature, new_signature, 1)

          old_wake = """    WakeBodyByIndex( contact.edges[0].bodyId );

    WakeBodyByIndex( contact.edges[1].bodyId );"""
          new_wake = """    if( wakeBodies )
    {
        WakeBodyByIndex( contact.edges[0].bodyId );
        WakeBodyByIndex( contact.edges[1].bodyId );
    }"""
          if cpp.count(old_wake) != 1:
              raise RuntimeError("DestroyContact wake block mismatch")
          cpp = cpp.replace(old_wake, new_wake, 1)
          world_cpp.write_text(cpp, encoding="utf-8")

          world_h = Path("src/dynamics/world.h")
          header = world_h.read_text(encoding="utf-8")
          old_decl = """    // body contact list / pairSet에서 해제한 뒤 slot을 free-list로 반환함.
    void DestroyContact( std::int32_t contactId );"""
          new_decl = """    // body contact list / pairSet에서 해제한 뒤 slot을 free-list로 반환함.
    // Chain batch처럼 연결 component를 이미 깨운 경로는 wake를 생략할 수 있음.
    void DestroyContact( std::int32_t contactId, bool wakeBodies = true );"""
          if header.count(old_decl) != 1:
              raise RuntimeError("DestroyContact declaration mismatch")
          header = header.replace(old_decl, new_decl, 1)
          world_h.write_text(header, encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.cpp src/dynamics/world.h
          git commit -m "perf(dynamics): batch chain contact wake updates"
          git push origin HEAD:feature/terrain-chain-lifecycle
