name: Chain contact wake patch

on:
  push:
    branches:
      - feature/terrain-chain-lifecycle
    paths:
      - .github/workflows/chain-contact-wake-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terrain-chain-lifecycle
          fetch-depth: 0
      - name: Apply and commit patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          world_cpp = Path('src/dynamics/world.cpp')
          cpp = world_cpp.read_text(encoding='utf-8')

          shape_start = cpp.index('void world::DestroyShapeByIndex(')
          shape_end = cpp.index('void world::SyncBodyProxies(', shape_start)
          shape_block = cpp[shape_start:shape_end]
          shape_block, count = re.subn(
              r'DestroyContact\(\s*contactId\s*\);',
              '// Chain batch는 시작할 때 연결 component를 이미 한 번 깨웠으므로\n            // child contact마다 같은 component wake를 반복하지 않음.\n            DestroyContact( contactId, !deferBodyUpdates );',
              shape_block,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'DestroyShape contact replacement count={count}')
          cpp = cpp[:shape_start] + shape_block + cpp[shape_end:]

          cpp, count = re.subn(
              r'void world::DestroyContact\(\s*std::int32_t contactId\s*\)',
              'void world::DestroyContact( std::int32_t contactId, bool wakeBodies )',
              cpp,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'DestroyContact signature replacement count={count}')

          wake_pattern = (
              r'\s*WakeBodyByIndex\(\s*contact\.edges\[0\]\.bodyId\s*\);'
              r'\s*WakeBodyByIndex\(\s*contact\.edges\[1\]\.bodyId\s*\);'
          )
          wake_replacement = (
              '\n\n    if( wakeBodies )\n'
              '    {\n'
              '        WakeBodyByIndex( contact.edges[0].bodyId );\n'
              '        WakeBodyByIndex( contact.edges[1].bodyId );\n'
              '    }'
          )
          cpp, count = re.subn(wake_pattern, wake_replacement, cpp, count=1)
          if count != 1:
              raise RuntimeError(f'DestroyContact wake replacement count={count}')
          world_cpp.write_text(cpp, encoding='utf-8')

          world_h = Path('src/dynamics/world.h')
          header = world_h.read_text(encoding='utf-8')
          header, count = re.subn(
              r'(    // body contact list / pairSet에서 해제한 뒤 slot을 free-list로 반환함\.\n)'
              r'    void DestroyContact\(\s*std::int32_t contactId\s*\);',
              r'\1    // Chain batch처럼 연결 component를 이미 깨운 경로는 wake를 생략할 수 있음.\n'
              r'    void DestroyContact( std::int32_t contactId, bool wakeBodies = true );',
              header,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'DestroyContact declaration replacement count={count}')
          world_h.write_text(header, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.cpp src/dynamics/world.h
          git diff --cached --check
          git commit -m "perf(dynamics): batch chain contact wake updates"
          git push origin HEAD:feature/terrain-chain-lifecycle
