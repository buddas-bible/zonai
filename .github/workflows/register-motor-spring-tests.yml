name: Register Motor spring tests

on:
  push:
    branches:
      - feature/motor-joint-spring
    paths:
      - tools/register_motor_spring_tests.py
      - .github/workflows/register-motor-spring-tests.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motor-joint-spring
      - name: Register focused tests
        run: python3 tools/register_motor_spring_tests.py
      - name: Commit registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CMakeLists.txt
          git diff --cached --check
          git commit -m "Register Motor spring tests"
          git push origin HEAD:feature/motor-joint-spring
