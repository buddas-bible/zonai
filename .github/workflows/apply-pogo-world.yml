name: Apply Pogo targeted patch

on:
  push:
    branches:
      - feature/pogo-joint
    paths:
      - "tools/apply_pogo_world.py"
      - ".github/workflows/apply-pogo-world.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pogo-joint
          fetch-depth: 0

      - name: Apply targeted Pogo patch
        run: python3 tools/apply_pogo_world.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: register Pogo test targets"
          git push origin HEAD:feature/pogo-joint
