name: Cleanup Filter RED branches

on:
  push:
    branches:
      - feature/filter-joint
    paths:
      - ".github/workflows/cleanup-filter-red-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete accidental RED branches
        run: |
          git push origin --delete feature/filter-joint-red feature/filter-joint-red2 feature/filter-joint-red3
