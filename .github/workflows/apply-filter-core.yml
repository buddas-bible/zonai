name: Apply Filter Joint core

on:
  push:
    branches:
      - feature/filter-joint
    paths:
      - "tools/apply_filter_core.py"
      - ".github/workflows/apply-filter-core.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/filter-joint
          fetch-depth: 0

      - name: Apply core integration
        run: python3 tools/apply_filter_core.py

      - name: Commit core integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.h src/dynamics/world.cpp
          git commit -m "feat: integrate Filter Joint with world solver flow"
          git push origin HEAD:feature/filter-joint
