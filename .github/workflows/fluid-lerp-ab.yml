name: Fluid interpolation A/B (R3g)

# Same-runner Release comparison, separate from the strict raw-bit gate.
# The historical baseline is intentional: changing it invalidates this audit.
on:
  pull_request:
    branches: [master]
    paths:
      - "src/fluid/fluidField2.cpp"
      - "src/math/deterministicMath.h"
      - ".github/workflows/fluid-lerp-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 6904f042f2c1f8cc8b0bee3dcf99c2c6be015591
          path: baseline
      - name: Build the same existing Release benchmark on both revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "cmake>=4.2,<4.3"
          for revision in baseline candidate; do
            cmake -S "$revision" -B "$revision/build" -DCMAKE_BUILD_TYPE=Release -DZONAI_BUILD_TESTS=ON -DZONAI_BUILD_SANDBOX=OFF
            cmake --build "$revision/build" --target sandboxWindStepBenchmark --parallel 2
          done
      - name: Alternate baseline and candidate runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          for repetition in 1 2 3; do
            if [ "$repetition" = 2 ]; then
              order="candidate baseline"
            else
              order="baseline candidate"
            fi
            for revision in $order; do
              "$revision/build/tests/sandboxWindStepBenchmark" --csv > "reports/$revision-$repetition.csv"
            done
          done
          for revision in baseline candidate; do
            "$revision/build/tests/sandboxWindStepBenchmark" --coupling-spike-audit > "reports/$revision-coupling.csv"
          done
      - name: Report timing and coupled scene differences
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee reports/comparison.txt
          import csv
          import math
          from pathlib import Path
          from statistics import median

          def read(name):
              with Path("reports", name).open(newline="") as file:
                  return list(csv.DictReader(file))

          keys = ("cell_m", "world_substeps", "fluid_substeps")
          def case(row):
              return tuple(row[k] for k in keys)

          def timing(revision):
              runs = [read(f"{revision}-{i}.csv") for i in (1, 2, 3)]
              maps = [{case(row): row for row in run} for run in runs]
              assert len(maps[0]) == 8 and all(m.keys() == maps[0].keys() for m in maps)
              return maps

          baseline, candidate = timing("baseline"), timing("candidate")
          assert baseline[0].keys() == candidate[0].keys()
          print("Release timing: median of three benchmark medians; informational only")
          print("cell_m,fluid_substeps,baseline_advection_ms,candidate_advection_ms,baseline_field_ms,candidate_field_ms,baseline_failed_frames_max,candidate_failed_frames_max")
          for key in sorted(baseline[0]):
              def metric(runs, field):
                  return median(float(r[key][field]) for r in runs)
              def failures(runs):
                  return max(int(r[key]["pcg_failed_frames"]) for r in runs)
              print(f"{key[0]},{key[2]},{metric(baseline, 'advection_ms'):.4f},{metric(candidate, 'advection_ms'):.4f},{metric(baseline, 'field_ms'):.4f},{metric(candidate, 'field_ms'):.4f},{failures(baseline)},{failures(candidate)}")

          audit_keys = (*keys, "obstacle_coupling", "drag", "frame")
          def audit(revision):
              rows = read(f"{revision}-coupling.csv")
              mapped = {tuple(row[k] for k in audit_keys): row for row in rows}
              assert len(rows) == len(mapped) == 192
              return mapped

          old, new = audit("baseline"), audit("candidate")
          assert old.keys() == new.keys()
          print("\nCoupled sandbox trajectory (not an exact-bit or performance gate)")
          for name in ("nonfinite_faces", "pcg_failed"):
              print(f"{name}: baseline={sum(int(r[name]) for r in old.values())}, candidate={sum(int(r[name]) for r in new.values())}")
          for name in ("pre_drag_continuity_rms", "post_drag_continuity_rms", "pre_drag_max_face_speed", "post_drag_max_face_speed", "body0_x", "body0_y", "body0_speed", "body0_omega", "drag_body_impulse", "drag_exchange_residual"):
              pairs = [(float(old[k][name]), float(new[k][name])) for k in old]
              assert all(math.isfinite(a) and math.isfinite(b) for a,b in pairs), name
              print(f"{name}: max_abs_baseline={max(abs(a) for a,b in pairs):.9g}, max_abs_candidate={max(abs(b) for a,b in pairs):.9g}, max_abs_delta={max(abs(a-b) for a,b in pairs):.9g}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluid-lerp-ab
          path: reports/
          if-no-files-found: warn
