name: Patch Weld Sandbox

on:
  push:
    branches:
      - feature/weld-joint

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weld-joint
          fetch-depth: 0

      - name: Patch Weld sandbox
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}\n---old---\n{old}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "sandbox/demo.h",
              '''    wheelSuspension,
              prismaticRail,
              mouseJointPlayground,''',
              '''    wheelSuspension,
              prismaticRail,
              weldPair,
              mouseJointPlayground,'''
          )

          replace_once(
              "sandbox/demo.cpp",
              '''    demoEntry{ demoKind::prismaticRail, "조인트", "프리즈매틱 레일", "캔버스: A/D 유지로 슬라이더를 레일 축 방향으로 밀기, 스페이스로 수직 충격량, S로 회전 충격량 가하기. 빠른 설정에서 자유·제한·모터·스프링과 결합 상태를 비교합니다. 스프링은 축 위치 목표, 모터는 축 속도 목표, 제한은 허용 범위를 제어합니다.", { 0.0f, 0.0f }, 110.0f },
              demoEntry{ demoKind::mouseJointPlayground,''',
              '''    demoEntry{ demoKind::prismaticRail, "조인트", "프리즈매틱 레일", "캔버스: A/D 유지로 슬라이더를 레일 축 방향으로 밀기, 스페이스로 수직 충격량, S로 회전 충격량 가하기. 빠른 설정에서 자유·제한·모터·스프링과 결합 상태를 비교합니다. 스프링은 축 위치 목표, 모터는 축 속도 목표, 제한은 허용 범위를 제어합니다.", { 0.0f, 0.0f }, 110.0f },
              demoEntry{ demoKind::weldPair, "조인트", "웰드 조인트", "캔버스: A/D 유지로 오른쪽 상자를 밀기, 스페이스로 위쪽 충격량, S로 회전 충격량을 가합니다. 한쪽에만 힘을 줘도 두 상자의 연결점과 상대 각도가 유지되어 하나의 강체처럼 움직이는지 관찰합니다.", { 0.0f, 0.0f }, 100.0f },
              demoEntry{ demoKind::mouseJointPlayground,'''
          )

          replace_once(
              "sandbox/rigidBodyDemo.h",
              '''    [[nodiscard]] jointId getPrismaticJoint() const noexcept { return prismaticJoint_; }

              [[nodiscard]] float getPrismaticCurrentSpeed() const;''',
              '''    [[nodiscard]] jointId getPrismaticJoint() const noexcept { return prismaticJoint_; }

              [[nodiscard]] jointId getWeldJoint() const noexcept { return weldJoint_; }

              [[nodiscard]] float getPrismaticCurrentSpeed() const;'''
          )

          replace_once(
              "sandbox/rigidBodyDemo.h",
              '''    void createWheelSuspension();
              void createPrismaticRail();
              void createMouseJointPlayground();''',
              '''    void createWheelSuspension();
              void createPrismaticRail();
              void createWeldPair();
              void createMouseJointPlayground();'''
          )

          replace_once(
              "sandbox/rigidBodyDemo.h",
              '''    jointId wheelJoint_{};
              jointId prismaticJoint_{};
              std::array<jointId, 2> carJoints_{};''',
              '''    jointId wheelJoint_{};
              jointId prismaticJoint_{};
              jointId weldJoint_{};
              std::array<jointId, 2> carJoints_{};'''
          )

          replace_once(
              "sandbox/rigidBodyDemo.cpp",
              '''    else if( kind == demoKind::prismaticRail )
              {
                  createPrismaticRail();
              }
              else if( kind == demoKind::mouseJointPlayground )''',
              '''    else if( kind == demoKind::prismaticRail )
              {
                  createPrismaticRail();
              }
              else if( kind == demoKind::weldPair )
              {
                  createWeldPair();
              }
              else if( kind == demoKind::mouseJointPlayground )'''
          )

          weld_scene = r'''void rigidBodyDemo::createWeldPair()
          {
              world_.SetGravity( {} );

              const bodyId bodyA = world_.CreateBody( bodyType::Dynamic, { { -0.7f, 0.0f }, {} } );
              const shapeId shapeA = world_.CreateShape( bodyA, MakeBox( { 0.55f, 0.35f } ) );
              shapes_.push_back( { bodyA, shapeA, "왼쪽 상자 [웰드]" } );

              const bodyId bodyB = world_.CreateBody( bodyType::Dynamic, { { 0.7f, 0.0f }, {} } );
              const shapeId shapeB = world_.CreateShape( bodyB, MakeBox( { 0.55f, 0.35f } ) );
              shapes_.push_back( { bodyB, shapeB, "오른쪽 상자 [웰드]" } );

              weldJointDef joint{};
              joint.bodyA = bodyA;
              joint.bodyB = bodyB;
              joint.localAnchorA = { 0.7f, 0.0f };
              joint.localAnchorB = { -0.7f, 0.0f };
              weldJoint_ = world_.createWeldJoint( joint );

              impulseBody_ = bodyB;
              torqueBody_ = bodyB;
          }

          '''
          replace_once(
              "sandbox/rigidBodyJointDemo.cpp",
              'void rigidBodyDemo::createMouseJointPlayground()\n',
              weld_scene + 'void rigidBodyDemo::createMouseJointPlayground()\n'
          )

          replace_once(
              "sandbox/jointDemoView.cpp",
              '''        if( kind != demoKind::distancePendulum && kind != demoKind::revoluteHinge && kind != demoKind::wheelSuspension && kind != demoKind::prismaticRail && kind != demoKind::mouseJointPlayground ) return;''',
              '''        if( kind != demoKind::distancePendulum && kind != demoKind::revoluteHinge && kind != demoKind::wheelSuspension && kind != demoKind::prismaticRail && kind != demoKind::weldPair && kind != demoKind::mouseJointPlayground ) return;'''
          )

          replace_once(
              "sandbox/jointDemoView.cpp",
              '''            else
              {
                  ImGui::TextWrapped( "질량이 다른 세 상자를 같은 Mouse Joint 설정으로 드래그해 추종 차이를 비교합니다." );''',
              '''            else if( kind == demoKind::weldPair )
              {
                  ImGui::TextWrapped( "Basic Weld는 두 anchor의 위치와 두 Body의 상대 각도를 동시에 고정합니다. 한쪽 상자에만 힘이나 회전 충격을 줘도 두 Body가 하나의 상대 프레임을 유지하는지 관찰합니다." );
              }
              else
              {
                  ImGui::TextWrapped( "질량이 다른 세 상자를 같은 Mouse Joint 설정으로 드래그해 추종 차이를 비교합니다." );'''
          )

          replace_once(
              "sandbox/jointDemoView.cpp",
              '''        if( kind == demoKind::prismaticRail && view_.getWorld().IsValid( view_.getPrismaticJoint() ) )
              {
                  drawPrismaticInspector();
              }
              }''',
              '''        if( kind == demoKind::prismaticRail && view_.getWorld().IsValid( view_.getPrismaticJoint() ) )
              {
                  drawPrismaticInspector();
              }
              else if( kind == demoKind::weldPair && view_.getWorld().IsValid( view_.getWeldJoint() ) )
              {
                  drawWeldInspector();
              }
              }'''
          )

          old_draw_start = '''    void draw( debugDraw& draw ) const override
              {
                  view_.draw( draw );
                  if( view_.getKind() != demoKind::prismaticRail || !view_.getWorld().IsValid( view_.getPrismaticJoint() ) ) return;

                  const prismaticJointData joint = view_.getWorld().getPrismaticJointData( view_.getPrismaticJoint() );'''
          new_draw_start = '''    void draw( debugDraw& draw ) const override
              {
                  view_.draw( draw );
                  if( view_.getKind() == demoKind::weldPair && view_.getWorld().IsValid( view_.getWeldJoint() ) )
                  {
                      const weldJointData joint = view_.getWorld().getWeldJointData( view_.getWeldJoint() );
                      constexpr ImU32 ANCHOR_A_COLOR = IM_COL32( 100, 235, 220, 255 );
                      constexpr ImU32 ANCHOR_B_COLOR = IM_COL32( 255, 220, 90, 255 );
                      constexpr ImU32 ERROR_COLOR = IM_COL32( 245, 100, 100, 255 );
                      constexpr ImU32 FRAME_A_COLOR = IM_COL32( 110, 180, 255, 255 );
                      constexpr ImU32 FRAME_B_COLOR = IM_COL32( 230, 120, 255, 255 );

                      draw.DrawPoint( joint.anchorA, ANCHOR_A_COLOR, 7.0f );
                      draw.DrawPoint( joint.anchorB, ANCHOR_B_COLOR, 7.0f );
                      draw.DrawSegment( { joint.anchorA, joint.anchorB }, ERROR_COLOR, 2.0f );

                      const vec2 axisA = Rotate( view_.getWorld().GetBodyTransform( joint.bodyA ).rotation, { 1.0f, 0.0f } );
                      const vec2 axisB = Rotate( view_.getWorld().GetBodyTransform( joint.bodyB ).rotation, { 1.0f, 0.0f } );
                      draw.DrawArrow( joint.anchorA, axisA, FRAME_A_COLOR, 0.55f );
                      draw.DrawArrow( joint.anchorB, axisB, FRAME_B_COLOR, 0.55f );
                      return;
                  }

                  if( view_.getKind() != demoKind::prismaticRail || !view_.getWorld().IsValid( view_.getPrismaticJoint() ) ) return;

                  const prismaticJointData joint = view_.getWorld().getPrismaticJointData( view_.getPrismaticJoint() );'''
          replace_once("sandbox/jointDemoView.cpp", old_draw_start, new_draw_start)

          weld_inspector = r'''    void drawWeldInspector()
              {
                  if( !ImGui::CollapsingHeader( "웰드 조인트 인스펙터###WeldJointInspector", ImGuiTreeNodeFlags_DefaultOpen ) ) return;

                  const weldJointData joint = view_.getWorld().getWeldJointData( view_.getWeldJoint() );
                  const vec2 anchorError = joint.anchorB - joint.anchorA;
                  ImGui::TextWrapped( "두 anchor가 같은 위치에 있고 상대 각도가 referenceAngle을 유지하도록 선형 2x2 제약과 각도 scalar 제약을 함께 풉니다." );
                  ImGui::Text( "Anchor A: (%.3f, %.3f)", joint.anchorA.x, joint.anchorA.y );
                  ImGui::Text( "Anchor B: (%.3f, %.3f)", joint.anchorB.x, joint.anchorB.y );
                  ImGui::Text( "Anchor 오차: (%.4f, %.4f) / %.4f m", anchorError.x, anchorError.y, Length( anchorError ) );
                  ImGui::Text( "기준 상대각: %.4f rad", joint.referenceAngle );
                  ImGui::Text( "상대 각도 오차: %.4f rad", joint.currentAngle );
                  ImGui::Text( "반력: (%.2f, %.2f) N / 크기 %.2f N", joint.force.x, joint.force.y, Length( joint.force ) );
                  ImGui::Text( "반토크: %.2f N*m", joint.torque );
              }

          '''
          replace_once(
              "sandbox/jointDemoView.cpp",
              'private:\n    void drawPrismaticInspector()\n',
              'private:\n' + weld_inspector + '    void drawPrismaticInspector()\n'
          )

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox/demo.h sandbox/demo.cpp sandbox/rigidBodyDemo.h sandbox/rigidBodyDemo.cpp sandbox/rigidBodyJointDemo.cpp sandbox/jointDemoView.cpp
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Add Basic Weld sandbox demo"
          git push origin HEAD:feature/weld-joint
