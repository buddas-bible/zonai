name: Orphan chain Release test patch

on:
  push:
    branches:
      - feature/orphan-chain-segment-update

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orphan-chain-segment-update
          fetch-depth: 0
      - name: Patch Release test
        run: python .github/orphan_chain_release_test_patch.py
      - name: Commit Release test
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dynamics/body_shape_contact_lifecycle_test.cpp
          git commit -m "test(dynamics): make parent chain no-op Release-safe"
          git push origin HEAD:feature/orphan-chain-segment-update
