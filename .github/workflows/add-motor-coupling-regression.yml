name: Apply Motor coupling regression

on:
  push:
    branches:
      - feature/motor-joint
    paths:
      - tools/add_motor_coupling_regression.py
      - .github/workflows/add-motor-coupling-regression.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motor-joint
      - name: Add regression
        run: python3 tools/add_motor_coupling_regression.py
      - name: Commit regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dynamics/motor_joint_test.cpp
          git diff --cached --check
          git commit -m "Add Motor off-center coupling regression"
          git push origin HEAD:feature/motor-joint
