name: Terrain chain RED patch

on:
  push:
    branches:
      - feature/terrain-chain-sandbox
    paths:
      - .github/workflows/terrain-demo-red-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terrain-chain-sandbox
          fetch-depth: 0
      - name: Wire RED test
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          anchor = '''add_executable(sandboxDemoTests sandbox/demo_test.cpp "${PROJECT_SOURCE_DIR}/sandbox/demo.cpp" "${PROJECT_SOURCE_DIR}/sandbox/rigidBodyDemo.cpp" "${PROJECT_SOURCE_DIR}/sandbox/rigidBodyJointDemo.cpp")
          target_include_directories(sandboxDemoTests PRIVATE "${PROJECT_SOURCE_DIR}/sandbox")
          target_link_libraries(sandboxDemoTests PRIVATE zonai::zonai)
          add_test(NAME sandboxDemoTests COMMAND sandboxDemoTests)
          '''
          block = anchor + '''
          add_executable(sandboxTerrainChainDemoTests sandbox/terrain_chain_demo_test.cpp "${PROJECT_SOURCE_DIR}/sandbox/demo.cpp" "${PROJECT_SOURCE_DIR}/sandbox/rigidBodyDemo.cpp" "${PROJECT_SOURCE_DIR}/sandbox/rigidBodyJointDemo.cpp")
          target_include_directories(sandboxTerrainChainDemoTests PRIVATE "${PROJECT_SOURCE_DIR}/sandbox")
          target_link_libraries(sandboxTerrainChainDemoTests PRIVATE zonai::zonai)
          add_test(NAME sandboxTerrainChainDemoTests COMMAND sandboxTerrainChainDemoTests)
          '''
          if text.count(anchor) != 1:
              raise RuntimeError(f"sandboxDemoTests anchor count={text.count(anchor)}")
          path.write_text(text.replace(anchor, block, 1), encoding="utf-8")
      - name: Commit RED wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CMakeLists.txt
          git diff --cached --check
          git commit -m "test(sandbox): wire terrain chain demo regression"
          git push origin HEAD:feature/terrain-chain-sandbox
