name: CMake

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "sandbox/**"
      - "tests/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest

          - name: Ubuntu
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake 4.2
        if: runner.os == 'Linux'
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DZONAI_BUILD_TESTS=ON

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: >
          cmake
          -S .
          -B build
          -DZONAI_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel

      - name: Build Ubuntu
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 2

      - name: Test Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Test Ubuntu
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Build Release lifecycle tests
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target broadPhaseLifecycleTests bodyShapeContactLifecycleTests contactConstraintTests restitutionTests islandTests islandSleepCcdTests worldQuerySensorTests contactCacheTests distanceJointTests distanceJointWorldTests sandboxDemoTests --parallel

      - name: Test Release lifecycle invariants
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release -R "^(broadPhaseLifecycleTests|bodyShapeContactLifecycleTests|contactConstraintTests|restitutionTests|islandTests|islandSleepCcdTests|worldQuerySensorTests|contactCacheTests|distanceJointTests|distanceJointWorldTests|sandboxDemoTests)$" --output-on-failure
