name: CMake

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "sandbox/**"
      - "tests/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest

          - name: Ubuntu
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake 4.2
        if: runner.os == 'Linux'
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DZONAI_BUILD_TESTS=ON

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: >
          cmake
          -S .
          -B build
          -DZONAI_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel

      - name: Build Ubuntu
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 2

      - name: Test Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Test Ubuntu
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # Diagnostic numbers are informational; TOI may miss some intermediate rotational contacts.
      - name: Report World rotational sweep oracle (Ubuntu Debug, informational)
        if: runner.os == 'Linux'
        run: |
          ./build/tests/worldRotatingShapeSweepOracleTests
          ./build/tests/worldRotatingBoxSweepOracleTests
          ./build/tests/worldRotatingCapsulePolygonOracleTests
          ./build/tests/worldChainRotatingConvexOracleTests
          ./build/tests/worldChainBentRotatingOracleTests
          ./build/tests/worldChainRetryTemporalTests
          ./build/tests/worldChainRetryStressTests

      - name: Report World rotational sweep oracle (Windows Debug, informational)
        if: runner.os == 'Windows'
        run: |
          .\build\tests\Debug\worldRotatingShapeSweepOracleTests.exe
          .\build\tests\Debug\worldRotatingBoxSweepOracleTests.exe
          .\build\tests\Debug\worldRotatingCapsulePolygonOracleTests.exe
          .\build\tests\Debug\worldChainRotatingConvexOracleTests.exe
          .\build\tests\Debug\worldChainBentRotatingOracleTests.exe
          .\build\tests\Debug\worldChainRetryTemporalTests.exe
          .\build\tests\Debug\worldChainRetryStressTests.exe

      - name: Build Release lifecycle tests
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target rotatingSweepBoundsTests worldRotatingCapsulePolygonOracleTests worldChainRotatingConvexOracleTests worldChainBentRotatingOracleTests worldChainRetryTemporalTests worldChainRetryStressTests worldShapeCastBenchmark worldRotatingToiBenchmark worldChainRetryBenchmark worldRotatingSceneBenchmark dynamicTreeBoxCastBenchmark dynamicTreeBoxCastTests worldRotatingShapeSweepOracleTests worldRotatingBoxSweepOracleTests broadPhaseLifecycleTests bodyShapeContactLifecycleTests contactConstraintTests restitutionTests islandTests islandSleepCcdTests worldQuerySensorTests worldOverlapAABBTests worldOverlapShapeTests worldSpatialQueryStressTests worldRayCastTests worldShapeCastTests worldChainShapeCastOwnershipTests worldChainConvexCastOwnershipTests sandboxShapeCastDemoTests sandboxShapeCastViewTests sandboxOverlapShapeDemoTests sandboxOverlapShapeViewTests contactCacheTests distanceJointTests distanceJointWorldTests moverJointTests moverJointWorldTests pogoJointTests pogoJointWorldTests filterJointTests filterJointWorldTests mouseJointTests mouseJointWorldTests revoluteJointTests revoluteJointWorldTests wheelJointTests wheelJointWorldTests sandboxDemoTests --parallel

      # Informational only: no numerical speed threshold or assertion on CI timings.
      - name: Sample BoxCast performance (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\dynamicTreeBoxCastBenchmark.exe --csv

      - name: Sample BoxCast traversal profile (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\dynamicTreeBoxCastBenchmark.exe --profile --csv

      - name: Sample World ShapeCast performance (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldShapeCastBenchmark.exe --csv

      # Median per-call Release timings; never gate CI on runner-specific speed.
      - name: Sample rotational TOI recheck profile (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldRotatingToiBenchmark.exe --csv

      - name: Sample Chain ghost retry cost (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldChainRetryBenchmark.exe --csv

      - name: Sample full World rotational scene performance (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldRotatingSceneBenchmark.exe --csv

      - name: Test Release lifecycle invariants
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release -R "^(rotatingSweepBoundsTests|worldRotatingSceneBenchmarkOracle|worldRotatingToiBenchmarkOracle|worldChainRetryBenchmarkOracle|worldShapeCastBenchmarkOracle|dynamicTreeBoxCastBenchmarkOracle|dynamicTreeBoxCastTests|worldRotatingShapeSweepOracleTests|worldRotatingBoxSweepOracleTests|worldRotatingCapsulePolygonOracleTests|worldChainRotatingConvexOracleTests|worldChainBentRotatingOracleTests|worldChainRetryTemporalTests|worldChainRetryStressTests|broadPhaseLifecycleTests|bodyShapeContactLifecycleTests|contactConstraintTests|restitutionTests|islandTests|islandSleepCcdTests|worldQuerySensorTests|worldOverlapAABBTests|worldOverlapShapeTests|worldSpatialQueryStressTests|worldRayCastTests|worldShapeCastTests|worldChainShapeCastOwnershipTests|worldChainConvexCastOwnershipTests|sandboxShapeCastDemoTests|sandboxShapeCastViewTests|sandboxOverlapShapeDemoTests|sandboxOverlapShapeViewTests|contactCacheTests|distanceJointTests|distanceJointWorldTests|moverJointTests|moverJointWorldTests|pogoJointTests|pogoJointWorldTests|filterJointTests|filterJointWorldTests|mouseJointTests|mouseJointWorldTests|revoluteJointTests|revoluteJointWorldTests|wheelJointTests|wheelJointWorldTests|sandboxDemoTests)$" --output-on-failure
