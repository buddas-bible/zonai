name: CMake

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "sandbox/**"
      - "tests/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest

          - name: Ubuntu
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake 4.2
        if: runner.os == 'Linux'
        run: python3 -m pip install "cmake>=4.2,<4.3"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DZONAI_BUILD_TESTS=ON

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: >
          cmake
          -S .
          -B build
          -DZONAI_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel

      - name: Build Ubuntu
        if: runner.os == 'Linux'
        run: cmake --build build --parallel 2

      - name: Test Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Test Ubuntu
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # First continuous FSI response check. Both variants run independent
      # but identically seeded World timelines, NOT frozen pressure replays.
      - name: Probe continuous small-cell World feedback (Ubuntu Debug, informational)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-world-feedback-audit

      - name: Probe local tracer near disappearing Cut-cell (Ubuntu Debug, informational)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-local-tracer-audit

      # Also exercise the real applied-transfer ledger on Ubuntu Debug.
      - name: Audit real small-cell applied tracer transfers (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-applied-transfer-audit

      # S2c research only: same World/Fluid history, compare default tracer
      # against opt-in partial-cell endpoint aperture redistribution.
      - name: Compare connected residual tracer remap (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-connected-residual-audit

      # S2c physical-risk probe: compare actual routing kilograms against
      # separate endpoint-MAC and signed Swept face-volume equivalents.
      - name: Audit connected tracer face capacity (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-connected-capacity-audit

      # S2c research: per physical face, sum directed transfers once and
      # compare independent swept-time open aperture against endpoint MAC.
      - name: Audit grouped moving-face tracer transport (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-grouped-face-audit

      # The MAC velocity history is unknown between steps; test the explicit
      # linear-endpoint interpolation proxy, not a claim of exact A(t)u(t).
      - name: Audit time-interpolated moving-face MAC proxy (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-time-varying-flux-audit

      # S2c independent temporal-reference experiment: identical prescribed
      # moving-solid pose/velocity, real fluid resolution 1/2/4/8/16.
      - name: Audit prescribed moving Cut-cell Fluid substeps (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-prescribed-substeps-audit

      # Same fixed path at real 1..64 Fluid dt, first a translating circle,
      # then a rotating capsule. Output a 64-step internal reference, not
      # a claim of analytic convergence or physically exact tracer capacity.
      - name: Audit high-resolution translation and rotation reference (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-prescribed-convergence-audit

      # S2c refinement: 16/32/64/128 solved steps at h=.25 and h=.125.
      # Two fine half-width faces aggregate to the same coarse physical face.
      - name: Audit prescribed time-space Cut-cell refinement (Ubuntu Debug)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --small-cell-prescribed-spatial-audit

      - name: Audit Cut-cell endpoint volume budgets (Ubuntu Debug, informational)
        if: runner.os == 'Linux'
        run: ./build/tests/sandboxWindStepBenchmark --cut-cell-volume-budget-audit

      # Diagnostic numbers are informational; TOI may miss some intermediate rotational contacts.
      - name: Report World rotational sweep oracle (Ubuntu Debug, informational)
        if: runner.os == 'Linux'
        run: |
          ./build/tests/worldRotatingShapeSweepOracleTests
          ./build/tests/worldRotatingBoxSweepOracleTests
          ./build/tests/worldRotatingCapsulePolygonOracleTests
          ./build/tests/worldChainRotatingConvexOracleTests
          ./build/tests/worldChainBentRotatingOracleTests
          ./build/tests/worldChainRetryTemporalTests
          ./build/tests/worldChainRetryStressTests

      - name: Report World rotational sweep oracle (Windows Debug, informational)
        if: runner.os == 'Windows'
        run: |
          .\build\tests\Debug\worldRotatingShapeSweepOracleTests.exe
          .\build\tests\Debug\worldRotatingBoxSweepOracleTests.exe
          .\build\tests\Debug\worldRotatingCapsulePolygonOracleTests.exe
          .\build\tests\Debug\worldChainRotatingConvexOracleTests.exe
          .\build\tests\Debug\worldChainBentRotatingOracleTests.exe
          .\build\tests\Debug\worldChainRetryTemporalTests.exe
          .\build\tests\Debug\worldChainRetryStressTests.exe

      - name: Build Release lifecycle tests
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target rotatingSweepBoundsTests worldRotatingCapsulePolygonOracleTests worldChainRotatingConvexOracleTests worldChainBentRotatingOracleTests worldChainRetryTemporalTests worldChainRetryStressTests worldShapeCastBenchmark worldRotatingToiBenchmark worldChainRetryBenchmark worldRotatingSceneBenchmark dynamicTreeBoxCastBenchmark dynamicTreeBoxCastTests worldRotatingShapeSweepOracleTests worldRotatingBoxSweepOracleTests broadPhaseLifecycleTests bodyShapeContactLifecycleTests contactConstraintTests restitutionTests islandTests islandSleepCcdTests worldQuerySensorTests worldContactEventTests worldContactHitEventTests worldOverlapAABBTests worldOverlapShapeTests worldSpatialQueryStressTests worldRayCastTests worldShapeCastTests worldChainShapeCastOwnershipTests worldChainConvexCastOwnershipTests sandboxShapeCastDemoTests sandboxShapeCastViewTests sandboxOverlapShapeDemoTests sandboxOverlapShapeViewTests contactCacheTests distanceJointTests distanceJointWorldTests moverJointTests moverJointWorldTests pogoJointTests pogoJointWorldTests filterJointTests filterJointWorldTests mouseJointTests mouseJointWorldTests revoluteJointTests revoluteJointWorldTests wheelJointTests wheelJointWorldTests sandboxDemoTests fluidFieldTests fluidPreconditionerBenchmark sandboxWindFlowDemoTests sandboxWindStepBenchmark --parallel

      # Informational only: no numerical speed threshold or assertion on CI timings.
      - name: Sample BoxCast performance (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\dynamicTreeBoxCastBenchmark.exe --csv

      - name: Sample BoxCast traversal profile (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\dynamicTreeBoxCastBenchmark.exe --profile --csv

      - name: Sample World ShapeCast performance (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldShapeCastBenchmark.exe --csv

      # Median per-call Release timings; never gate CI on runner-specific speed.
      - name: Sample rotational TOI recheck profile (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldRotatingToiBenchmark.exe --csv

      - name: Sample Chain ghost retry cost (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldChainRetryBenchmark.exe --csv

      - name: Sample full World rotational scene performance (Release, informational)
        if: runner.os == 'Windows'
        run: .\build\tests\Release\worldRotatingSceneBenchmark.exe --csv

      # Informational only: same cold-start scene with both preconditioners.
      # Invalid comparison (Jacobi iteration limit) prints speedup=0, not a win.
      - name: Sample Cut-cell PCG preconditioner performance (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --csv

      # Compare 0/16/48 immovable obstacles with two movable bodies.
      # Informational only: report both convergence and per-phase timings.
      - name: Sample static obstacle Schur scaling (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --static-sweep

      # Compare bounding-box-limited analytic cell area accumulation against
      # the full cell-by-shape reference on the same Release runner.
      - name: Sample analytic Cut-cell area bounding (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --area-sweep

      # Compare disjoint analytic MAC face clipping against the full face scan.
      - name: Sample analytic Cut-cell face clipping (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --face-sweep

      # Compare 0/16/48 static obstacles with all-shape vs movable-only
      # coupled Schur boundary assembly, on the same Release runner.
      - name: Sample movable-only Schur boundaries (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --mobility-sweep

      # Compare full-grid and blocked-index Cut-cell boundary synchronization.
      # Pressure and total step times are informational, not performance gates.
      - name: Sample indexed Cut-cell boundary sync (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --boundary-sync-sweep

      # Compare immutable current-step analytic shape reuse with full rebuilds.
      # Same obstacles, pressure solver and Release runner; timing is informational.
      - name: Sample analytic snapshot reuse (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --geometry-reuse-sweep

      # True two-snapshot motion with disjoint static obstacles: report swept
      # quadrature time independently from pressure and full Field step.
      - name: Sample moving-only analytic swept flux (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --swept-motion-sweep

      # With moving-only geometry enabled, isolate full-grid MAC face scans
      # versus clipped moving Shape AABB ranges on a real second swept step.
      - name: Sample bounded moving swept faces (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --swept-bounds-sweep

      # Profile the dominant IC0 application stage with per-pass coefficient
      # arrays versus original per-cell AoS, preserving PCG convergence.
      - name: Sample split active IC0 coefficients (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --ic0-split-sweep

      # PCG vector dot products and updates: full grid vs already computed
      # active fluid cells, including thin and substantial static obstacles.
      - name: Sample active-cell PCG vectors (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\fluidPreconditionerBenchmark.exe --pcg-active-vectors-sweep

      # A real headless Sandbox World interleave, 8 World substeps and 1/2/4/8 Fluid steps.
      # Frame medians are informational; never gate CI on runner-dependent wall time.
      - name: Sample Wind multi-substep stage profile (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --csv

      # Evaluate the previous pressure against the *new* Schur system without
      # modifying PCG initial guesses; measure residual ratio over 1/2/4/8 steps.
      - name: Probe previous pressure as potential PCG initial guess (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --pressure-reuse-probe

      # Trial: reuse previous pressure as guarded PCG x0 only when its true
      # residual is at least 50% smaller; compare convergence and real FPS cost.
      # Timings remain informational, not performance gates.
      - name: Sample guarded PCG pressure warm start (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --pcg-warmstart-sweep

      # Per-frame, fixed-cadence comparison of coupled/uncoupled and drag on/off.
      # CSV is diagnostic; do not gate CI on runner-dependent physics magnitudes.
      - name: Sample Wind coupling spikes (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --coupling-spike-audit

      # Read-only stage trace for the known V-face (17,13) spike reproduction.
      - name: Sample Cut-cell peak face stage (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --face-stage-audit

      # Copy the real pre-projection state once; compare cached vs reference
      # Schur L on identical moving-boundary geometry and Body snapshots.
      - name: Sample frozen Cut-cell pressure A-B (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --frozen-pressure-audit

      # S2c research only: same exact pre-projection state, unchanged base
      # alongside opt-in Galerkin small-cell pressure pooling (default OFF).
      - name: Probe connected small-cell pressure pooling (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-merge-audit

      - name: Sweep frozen small-cell pressure thresholds (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-merge-threshold-audit

      - name: Check frozen small-cell pressure at different cadences (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-merge-cadence-audit

      - name: Probe continuous small-cell World feedback (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-world-feedback-audit

      - name: Probe local tracer near disappearing Cut-cell (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-local-tracer-audit

      # S2c diagnostic: reconstruct actual transferred tracer on the real
      # World8/Fluid4 disappearing-cell path, per Cell and local stencil.
      - name: Audit real small-cell applied tracer transfers (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-applied-transfer-audit

      - name: Compare connected residual tracer remap (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-connected-residual-audit

      - name: Audit connected tracer face capacity (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-connected-capacity-audit

      - name: Audit grouped moving-face tracer transport (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-grouped-face-audit

      - name: Audit time-interpolated moving-face MAC proxy (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-time-varying-flux-audit

      - name: Audit prescribed moving Cut-cell Fluid substeps (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-prescribed-substeps-audit

      - name: Audit high-resolution translation and rotation reference (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-prescribed-convergence-audit

      - name: Audit prescribed time-space Cut-cell refinement (Windows Release)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --small-cell-prescribed-spatial-audit

      - name: Audit Cut-cell endpoint volume budgets (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --cut-cell-volume-budget-audit

      # Identical World/Fluid scene using original on-the-fly IC(0) sweeps.
      # Compare with the previous cached run on this same Windows runner.
      - name: Sample Wind reference IC0 sweep (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --ic0-reference --csv

      # Existing cached IC(0) dense sweeps against the new active-cell iteration.
      # Costs from the same Windows runner are for diagnosis, not a CI speed gate.
      - name: Sample Wind dense cached IC0 sweep (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --ic0-dense --csv

      # Same active-cell IC(0) and moving World scene but original Schur face lookup.
      # Compare with default Schur edge cache using informational medians only.
      - name: Sample Wind reference Schur operator (Windows Release, informational)
        if: runner.os == 'Windows'
        run: .\\build\\tests\\Release\\sandboxWindStepBenchmark.exe --schur-reference --csv

      - name: Test Release lifecycle invariants
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release -R "^(rotatingSweepBoundsTests|worldRotatingSceneBenchmarkOracle|worldRotatingToiBenchmarkOracle|worldChainRetryBenchmarkOracle|worldShapeCastBenchmarkOracle|dynamicTreeBoxCastBenchmarkOracle|dynamicTreeBoxCastTests|worldRotatingShapeSweepOracleTests|worldRotatingBoxSweepOracleTests|worldRotatingCapsulePolygonOracleTests|worldChainRotatingConvexOracleTests|worldChainBentRotatingOracleTests|worldChainRetryTemporalTests|worldChainRetryStressTests|broadPhaseLifecycleTests|bodyShapeContactLifecycleTests|contactConstraintTests|restitutionTests|islandTests|islandSleepCcdTests|worldQuerySensorTests|worldContactEventTests|worldContactHitEventTests|worldOverlapAABBTests|worldOverlapShapeTests|worldSpatialQueryStressTests|worldRayCastTests|worldShapeCastTests|worldChainShapeCastOwnershipTests|worldChainConvexCastOwnershipTests|sandboxShapeCastDemoTests|sandboxShapeCastViewTests|sandboxOverlapShapeDemoTests|sandboxOverlapShapeViewTests|contactCacheTests|distanceJointTests|distanceJointWorldTests|moverJointTests|moverJointWorldTests|pogoJointTests|pogoJointWorldTests|filterJointTests|filterJointWorldTests|mouseJointTests|mouseJointWorldTests|revoluteJointTests|revoluteJointWorldTests|wheelJointTests|wheelJointWorldTests|sandboxDemoTests|fluidFieldTests|sandboxWindFlowDemoTests)$" --output-on-failure
