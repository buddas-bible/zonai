name: Chain batch wake patch

on:
  push:
    branches:
      - feature/terrain-chain-lifecycle
    paths:
      - .github/workflows/chain-batch-wake-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terrain-chain-lifecycle
          fetch-depth: 0
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          world_cpp = Path("src/dynamics/world.cpp")
          cpp = world_cpp.read_text(encoding="utf-8")

          replacements = [
              (
                  "const std::int32_t shapeIndex = CreateShapeByIndex( bodyIndex, std::move( geometry ), filter, density, true );",
                  "const std::int32_t shapeIndex = CreateShapeByIndex( bodyIndex, std::move( geometry ), filter, density, false );",
              ),
              (
                  "const std::int32_t shapeIndex = CreateShapeByIndex( bodyIndex, segment, definition.filter, 0.0f, false );",
                  "const std::int32_t shapeIndex = CreateShapeByIndex( bodyIndex, segment, definition.filter, 0.0f, true );",
              ),
              (
                  "std::int32_t world::CreateShapeByIndex( std::int32_t bodyIndex, shapeGeometry geometry, collisionFilter filter, float density, bool updateBodyMassData )",
                  "std::int32_t world::CreateShapeByIndex( std::int32_t bodyIndex, shapeGeometry geometry, collisionFilter filter, float density, bool deferBodyUpdates )",
              ),
              (
                  "    WakeBodyByIndex( bodyIndex );\n\n    assert( bodySims_.size() == bodies_.size() );",
                  "    if( !deferBodyUpdates )\n    {\n        WakeBodyByIndex( bodyIndex );\n    }\n\n    assert( bodySims_.size() == bodies_.size() );",
              ),
              (
                  "    if( updateBodyMassData )\n    {\n        UpdateBodyMassData( bodyIndex );\n    }\n\n    return shapeIndex;",
                  "    if( !deferBodyUpdates )\n    {\n        UpdateBodyMassData( bodyIndex );\n    }\n\n    return shapeIndex;",
              ),
              (
                  "void world::DestroyChainByIndex( std::int32_t chainIndex, bool updateBodyMassData )",
                  "void world::DestroyChainByIndex( std::int32_t chainIndex, bool deferBodyUpdates )",
              ),
              (
                  "    const std::int32_t bodyIndex = chain.bodyId;\n    body& body = bodies_[bodyIndex];\n\n    // body의 singly linked parent-chain list에서 현재 chain을 분리함.",
                  "    const std::int32_t bodyIndex = chain.bodyId;\n    body& body = bodies_[bodyIndex];\n\n    if( !deferBodyUpdates )\n    {\n        WakeBodyByIndex( bodyIndex );\n    }\n\n    // body의 singly linked parent-chain list에서 현재 chain을 분리함.",
              ),
              (
                  "        DestroyShapeByIndex( shapeIndex, false );",
                  "        DestroyShapeByIndex( shapeIndex, true );",
              ),
              (
                  "    if( updateBodyMassData )\n    {\n        UpdateBodyMassData( bodyIndex );\n    }\n\n    const std::uint16_t generation = chain.generation;",
                  "    if( !deferBodyUpdates )\n    {\n        UpdateBodyMassData( bodyIndex );\n    }\n\n    const std::uint16_t generation = chain.generation;",
              ),
              (
                  "        DestroyChainByIndex( body.headChainId, false );",
                  "        DestroyChainByIndex( body.headChainId, true );",
              ),
              (
                  "        DestroyShapeByIndex( body.headShapeId, false );",
                  "        DestroyShapeByIndex( body.headShapeId, true );",
              ),
              (
                  "void world::DestroyShapeByIndex( std::int32_t shapeIndex, bool updateBodyMassData )",
                  "void world::DestroyShapeByIndex( std::int32_t shapeIndex, bool deferBodyUpdates )",
              ),
              (
                  "    const std::int32_t bodyIndex = shape.bodyId;\n    body& body = bodies_[bodyIndex];\n\n    WakeBodyByIndex( bodyIndex );\n\n    // Box2D처럼 먼저 body의 shape list에서 분리함.",
                  "    const std::int32_t bodyIndex = shape.bodyId;\n    body& body = bodies_[bodyIndex];\n\n    if( !deferBodyUpdates )\n    {\n        WakeBodyByIndex( bodyIndex );\n    }\n\n    // Box2D처럼 먼저 body의 shape list에서 분리함.",
              ),
              (
                  "    if( updateBodyMassData )\n    {\n        UpdateBodyMassData( bodyIndex );\n    }\n\n    const std::uint16_t generation = shape.generation;",
                  "    if( !deferBodyUpdates )\n    {\n        UpdateBodyMassData( bodyIndex );\n    }\n\n    const std::uint16_t generation = shape.generation;",
              ),
          ]

          for old, new in replacements:
              count = cpp.count(old)
              if count != 1:
                  raise RuntimeError(f"world.cpp replacement expected once, found {count}: {old[:80]!r}")
              cpp = cpp.replace(old, new, 1)

          create_anchor = "    const std::size_t segmentCount = definition.isLoop ? points.size() : points.size() - 1;\n    chain.shapeIds.reserve( segmentCount );"
          create_replacement = "    // chain child 생성 전에 연결된 body/island를 한 번만 깨움.\n    WakeBodyByIndex( bodyIndex );\n\n    const std::size_t segmentCount = definition.isLoop ? points.size() : points.size() - 1;\n    chain.shapeIds.reserve( segmentCount );"
          if cpp.count(create_anchor) != 1:
              raise RuntimeError("CreateChain wake anchor mismatch")
          cpp = cpp.replace(create_anchor, create_replacement, 1)

          world_cpp.write_text(cpp, encoding="utf-8")

          world_h = Path("src/dynamics/world.h")
          header = world_h.read_text(encoding="utf-8")
          old_header = """    // public CreateShape와 chain batch가 같은 slot/proxy/link 경로를 사용함.\n    // chain batch는 마지막에 한 번만 mass/extents를 다시 계산함.\n    [[nodiscard]] std::int32_t CreateShapeByIndex( std::int32_t bodyIndex, shapeGeometry geometry, collisionFilter filter, float density, bool updateBodyMassData );\n\n    void DestroyBodyByIndex( std::int32_t bodyIndex );\n    void DestroyChainByIndex( std::int32_t chainIndex, bool updateBodyMassData = true );\n    void DestroyShapeByIndex( std::int32_t shapeIndex, bool updateBodyMassData = true );"""
          new_header = """    // public shape 경로와 chain batch가 같은 slot/proxy/link 로직을 사용함.\n    // chain batch는 body 전체 wake와 mass/extents 갱신을 바깥에서 한 번만 수행함.\n    [[nodiscard]] std::int32_t CreateShapeByIndex( std::int32_t bodyIndex, shapeGeometry geometry, collisionFilter filter, float density, bool deferBodyUpdates );\n\n    void DestroyBodyByIndex( std::int32_t bodyIndex );\n    void DestroyChainByIndex( std::int32_t chainIndex, bool deferBodyUpdates = false );\n    void DestroyShapeByIndex( std::int32_t shapeIndex, bool deferBodyUpdates = false );"""
          if header.count(old_header) != 1:
              raise RuntimeError("world.h replacement mismatch")
          header = header.replace(old_header, new_header, 1)
          world_h.write_text(header, encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.cpp src/dynamics/world.h
          git commit -m "perf(dynamics): batch chain wake updates"
          git push origin HEAD:feature/terrain-chain-lifecycle
