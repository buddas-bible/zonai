name: Apply Motor spring World integration

on:
  push:
    branches:
      - feature/motor-joint-spring
    paths:
      - tools/apply_motor_spring_world.py
      - .github/workflows/apply-motor-spring-world.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motor-joint-spring
      - name: Apply World integration
        run: python3 tools/apply_motor_spring_world.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.h src/dynamics/world.cpp
          git diff --cached --check
          git commit -m "Integrate Motor transform springs into World"
          git push origin HEAD:feature/motor-joint-spring
