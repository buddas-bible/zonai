name: Apply Motor World patch

on:
  push:
    branches:
      - feature/motor-joint
    paths:
      - tools/apply_motor_world_patch.py
      - .github/workflows/apply-motor-world-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motor-joint
      - name: Apply patch
        run: python3 tools/apply_motor_world_patch.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.cpp
          git diff --cached --check
          git commit -m "Integrate Motor Joint with World solver"
          git push origin HEAD:feature/motor-joint
