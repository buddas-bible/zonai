name: Orphan chain extent GREEN patch

on:
  push:
    branches:
      - feature/orphan-chain-segment-update

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orphan-chain-segment-update
          fetch-depth: 0
      - name: Patch extent refresh
        run: python .github/orphan_chain_extent_green_patch.py
      - name: Commit extent refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamics/world.h src/dynamics/world.cpp src/dynamics/chainSegmentWorld.cpp
          git commit -m "fix(dynamics): refresh body extents after chain update"
          git push origin HEAD:feature/orphan-chain-segment-update
