name: Part 5 Contact Query Helper

on:
  push:
    branches:
      - refactor/body-shape-contact-reaudit

permissions:
  contents: write

jobs:
  patch-contact-query:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/body-shape-contact-reaudit
          fetch-depth: 0

      - name: Align public contact query semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f'{path}: expected one occurrence, found {count}: {old[:100]!r}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              Path('src/dynamics/world.cpp'),
              '''        // speculative point는 solver에는 사용하지만 실제 touching query에서는 제외함.\n        if( IsTouchingManifold( contactSim.manifold ) )''',
              '''        // pointCount가 있으면 speculative point도 solver-active Contact로 public query에 노출함.\n        if( contactSim.manifold.pointCount > 0 )'''
          )

          replace_once(
              Path('tests/dynamics/world_test.cpp'),
              '''            ) == 0\n        );\n\n        world.SetBodyLinearVelocity(''',
              '''            ) == 1\n        );\n\n        assert( contacts[0].manifold.pointCount == 1 );\n        assert( contacts[0].manifold.points[0].separation > 0.0f );\n\n        world.SetBodyLinearVelocity('''
          )
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/dynamics/world.cpp tests/dynamics/world_test.cpp; then
            echo 'No changes produced'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dynamics/world.cpp tests/dynamics/world_test.cpp
          git commit -m 'Expose speculative solver contacts in body queries'
          git push origin HEAD:refactor/body-shape-contact-reaudit
