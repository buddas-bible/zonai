name: Part 5 Contact Query Helper

on:
  push:
    branches:
      - refactor/body-shape-contact-audit

permissions:
  contents: write

jobs:
  patch-world-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/body-shape-contact-audit
          fetch-depth: 0

      - name: Normalize query formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/dynamics/world.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''        if( involvesShape &&\n  IsTouchingManifold( contactSim.manifold ) )'''
          new = '''        if( involvesShape &&\n            IsTouchingManifold( contactSim.manifold ) )'''

          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected one formatting target, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dynamics/world.cpp
          git commit -m 'Normalize shape contact query formatting'
          git push origin HEAD:refactor/body-shape-contact-audit
