name: Apply Filter Joint RED

on:
  push:
    branches:
      - feature/filter-joint
    paths:
      - "tools/add_filter_red.py"
      - ".github/workflows/apply-filter-red.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/filter-joint
          fetch-depth: 0

      - name: Apply RED contract
        run: python3 tools/add_filter_red.py

      - name: Commit RED contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dynamics/pogo_joint_world_test.cpp
          git commit -m "test: add Filter Joint RED contract"
          git push origin HEAD:feature/filter-joint
